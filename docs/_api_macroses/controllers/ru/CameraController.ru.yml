title: '### :material-camera: Камера'
desc: |-
  Предоставляет конечные точки для управления видом пользователя в игре.
  Позволяет внешним инструментам панорамировать камеру по конкретным координатам или программно настраивать уровень масштабирования.
/api/v1/camera/change/zoom:
  desc: |-
    Настраивает уровень масштабирования игровой камеры на указанное значение,
    мгновенно изменяя поле зрения. Это позволяет точно
    контролировать, насколько близко или далеко находится камера на игровой карте.
  method: POST
  tags:
  - UI
  - Camera
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url 'http://localhost:8765/api/v1/camera/change/zoom?zoom=15'
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
    "success": true,
    "errors": [],
    "warnings": [],
    "timestamp": "2025-12-09T19:16:06.4839322Z"
    }
    ```
/api/v1/camera/change/position:
  desc: Мгновенно перемещает игровую камеру на указанные мировые координаты на текущей карте.
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url 'http://localhost:8765/api/v1/camera/change/position?x=50&y=50'
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-08T19:13:29.997162Z"
    }
    ```
  method: POST
/api/v1/camera/follow/pawn:
  desc: Перемещает камеру к пешке по её числовому ID. Удобно для слежения за конкретным поселенцем, животным или врагом.
  method: POST
  tags:
  - UI
  - Camera
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url 'http://localhost:8765/api/v1/camera/follow/pawn?pawn_id=526'
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
    "success": true,
    "errors": [],
    "warnings": [],
    "timestamp": "2025-12-09T19:16:06.4839322Z"
    }
    ```
/api/v1/camera/screenshot:
  desc: Делает скриншот текущего вида игры в формате base64-JPEG. Поддерживает изменение размера — опустите width/height для нативного разрешения.
  method: POST
  tags:
  - UI
  - Camera
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url http://localhost:8765/api/v1/camera/screenshot \
    --header 'content-type: application/json' \
    --data '{"width": 1280, "height": 720}'
    ```
  request: |-
    **Request:**
    ```json
    {
        "width": 1280,
        "height": 720
    }
    ```
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "data": {
            "image": "/9j/4AAQSkZJRgAB...",
            "width": 1280,
            "height": 720
        },
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-09T19:16:06.4839322Z"
    }
    ```
/api/v1/camera/screenshot/native:
  desc: Перемещает камеру в указанную позицию и сохраняет высококачественный скриншот напрямую на диск хост-машины.
  method: POST
  tags:
  - UI
  - Camera
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url http://localhost:8765/api/v1/camera/screenshot/native \
    --header 'content-type: application/json' \
    --data '{"x": 100, "z": 100, "path": "C:/screenshots/colony.png"}'
    ```
  request: |-
    **Request:**
    ```json
    {
        "x": 100,
        "z": 100,
        "path": "C:/screenshots/colony.png"
    }
    ```
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-09T19:16:06.4839322Z"
    }
    ```
/api/v1/camera/stream/start:
  desc: |-
    Запускает прямую видеотрансляцию текущего вида камеры игры.
    Эта конечная точка инициирует трансляцию игрового процесса в реальном времени,
    захватывая именно то, что видно в основном окне игрока.
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url 'http://localhost:8765/api/v1/camera/stream/start'
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-08T19:13:29.997162Z"
    }
    ```
  method: POST
/api/v1/camera/stream/stop:
  desc: Корректно останавливает активную прямую видеотрансляцию вида камеры игры.
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url 'http://localhost:8765/api/v1/camera/stream/stop'
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-08T19:13:29.997162Z"
    }
    ```
  method: POST
/api/v1/camera/stream/setup:
  desc: Настраивает параметры прямой видеотрансляции вида камеры игры перед её запуском.
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url 'http://localhost:8765/api/v1/camera/stream/setup?ip=127.0.0.1&port=5007&frame_width=1920&frame_height=1080&fps=15&quality=30'
    ```
  request: |-
    **Request:**
    ```json
    {
        "port": 8080,
        "address": "127.0.0.1",
        "frame_width": 1280,
        "frame_height": 720,
        "target_fps": 30,
        "jpeg_quality": 85
    }
    ```
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-08T19:13:29.997162Z"
    }
    ```
  method: POST
/api/v1/camera/stream/status:
  desc: Возвращает текущий статус и конфигурацию прямой видеотрансляции камеры.
  curl: |-
    **Example:**
    ```bash
    curl --request GET \
    --url 'http://localhost:8765/api/v1/camera/stream/status'
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
    "success": true,
    "data": {
        "is_streaming": false,
        "config": {
        "port": 5007,
        "address": "127.0.0.1",
        "frame_width": 1280,
        "frame_height": 720,
        "target_fps": 15,
        "jpeg_quality": 50
        }
    },
    "errors": [],
    "warnings": [],
    "timestamp": "2025-12-09T19:31:56.8297247Z"
    }
    ```
  method: GET
