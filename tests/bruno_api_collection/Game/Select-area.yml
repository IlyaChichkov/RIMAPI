info:
  name: Select-area
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseURL}}/api/v1/game/select-area"
  body:
    type: json
    data: |-
      {
        "position_a": {
          "x": 100,
          "y": 0,
          "z": 100
        },
        "position_b": {
          "x": 110,
          "y": 0,
          "z": 110
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
