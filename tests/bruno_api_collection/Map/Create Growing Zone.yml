info:
  name: Create Growing Zone
  type: http
  seq: 25

http:
  method: POST
  url: "{{baseURL}}/api/v1/map/zone/growing"
  body:
    type: json
    data: |-
      {
        "map_id": 0,
        "plant_def": "Plant_Corn",
        "point_a": {"x": 50, "y": 0, "z": 50},
        "point_b": {"x": 54, "y": 0, "z": 54}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
