info:
  name: Set Stuff Color
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/api/v1/dev/stuff/color"
  body:
    type: json
    data: |-
      {
        "name": "WoodLog",
        "hex": "#8B5A2B"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
