info:
  name: Setup
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}/api/v1/camera/stream/setup"
  body:
    type: json
    data: |-
      {
        "address": "127.0.0.1",
        "port": 5007,
        "frame_width": 1280,
        "frame_height": 720,
        "target_fps": 15,
        "jpeg_quality": 50
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
